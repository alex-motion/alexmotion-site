<p style="margin: 0">Since 2008, the Department of Defense observes <b>Warrior Care Month</b> to highlight the strength, resilience and recovery of military personnel.</p>
<p style="margin: 0">Check out <b>Day of Healing</b> events near you to focus on improving physical and mental well-being.</p>
