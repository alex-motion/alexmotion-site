<main id="main">

  <section class="section">
    <div class="wrap contact-layout">

      <h1>Let&rsquo;s Chat!</h1>

      <!-- Formspree: replace YOUR_FORM_ID below with the ID from your form's
           endpoint (https://formspree.io/f/xxxxxxxx). Nothing else needs changing.
           Without JS this posts natively to Formspree and still works. -->
      <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

        <fieldset class="field-group">
          <!-- Hidden visually, kept for screen readers so the two name inputs are
               still announced as one group. -->
          <legend class="visually-hidden">Name</legend>
          <div class="field-row">
            <div class="field">
              <label for="first-name">First Name</label>
              <input id="first-name" name="first-name" type="text" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="last-name">Last Name</label>
              <input id="last-name" name="last-name" type="text" autocomplete="family-name" required>
            </div>
          </div>
        </fieldset>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <!-- _subject sets the subject line of the email that lands in your inbox -->
          <label for="subject">Subject</label>
          <input id="subject" name="_subject" type="text" required>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required></textarea>
        </div>

        <!-- Spam honeypot: hidden from people, tempting to bots. Formspree drops
             any submission that fills it in. -->
        <input class="visually-hidden" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="form-actions">
          <button class="btn" type="submit">Submit</button>
        </div>

        <p class="form-status" role="status" aria-live="polite"></p>
      </form>

    </div>
  </section>
